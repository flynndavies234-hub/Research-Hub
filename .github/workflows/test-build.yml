name: V3 Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'v3-development'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check main process
        run: node --check main.js
      - name: Syntax check preload
        run: node --check preload.js
      - name: Syntax check renderer
        run: node --check renderer.js
      - name: Static integration audit
        run: node scripts/static-check.js
      - name: Unit tests
        run: npm test

      - name: Install dependencies
        run: npm install
      - name: Build Windows test installer
        run: npm run dist:win
      - name: Upload V3 test build
        uses: actions/upload-artifact@v4
        with:
          name: AI-Research-V3-Test
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 7
