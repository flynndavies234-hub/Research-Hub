name: V2.6 Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check main process
        run: node --check main.js
      - name: Syntax check preload
        run: node --check preload.js
      - name: Extract and syntax check renderer
        shell: pwsh
        run: |
          $html = Get-Content index.html -Raw
          $m = [regex]::Match($html, '(?s)<script>(.*?)</script>')
          if (-not $m.Success) { throw 'Renderer script not found' }
          Set-Content renderer-check.js $m.Groups[1].Value
          node --check renderer-check.js
      - name: Install dependencies
        run: npm install
      - name: Build Windows test installer
        run: npm run dist:win
      - name: Upload V2.5 test build
        uses: actions/upload-artifact@v4
        with:
          name: AI-Research-V2.6-Test
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 7
