name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check main process
        run: node --check main.js

      - name: Syntax check preload
        run: node --check preload.js

      - name: Extract and syntax check renderer
        shell: pwsh
        run: |
          $html = Get-Content index.html -Raw
          $m = [regex]::Match($html, '(?s)<script>(.*?)</script>')
          if (-not $m.Success) { throw 'Renderer script not found' }
          Set-Content renderer-check.js $m.Groups[1].Value
          node --check renderer-check.js

      - name: Static integration audit
        run: node scripts/static-check.js

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $expected = "v$v"
          $actual = "${{ github.ref_name }}"
          if ($actual -ne $expected) { throw "Tag $actual does not match package version $expected" }

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AI Research v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/latest.yml
            dist/*.exe
            dist/*.blockmap

# CI publish fix trigger
